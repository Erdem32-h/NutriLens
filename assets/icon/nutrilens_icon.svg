<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#05170D"/>
      <stop offset="100%" stop-color="#0D381E"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="0.5" cy="0.5" r="0.46">
      <stop offset="0%" stop-color="#1A6B3A" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#05170D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gaugeArc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="45%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="leafFill" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BBF7D0"/>
    </linearGradient>
    <filter id="leafShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full-bleed square background (iOS masks corners; no alpha) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#ambientGlow)"/>

  <!-- Lens Housing + Dark Ring -->
  <circle cx="512" cy="512" r="324" fill="#092615" stroke="#1E4D30" stroke-width="52"/>

  <!-- HP Score Colored Gauge Arc -->
  <path d="M 235 678 A 324 324 0 1 1 789 678"
        fill="none" stroke="url(#gaugeArc)" stroke-width="52" stroke-linecap="round"/>

  <!-- Inner Leaf Silhouette -->
  <path d="M 512 316
           C 618 392, 666 482, 666 555
           C 666 644, 597 708, 512 725
           C 427 708, 358 644, 358 555
           C 358 482, 406 392, 512 316 Z"
        fill="url(#leafFill)" filter="url(#leafShadow)"/>

  <!-- Optical Lens Pupil & Iris -->
  <circle cx="512" cy="546" r="60" fill="#092615"/>
  <circle cx="512" cy="546" r="30" fill="#4ADE80"/>

  <!-- Specular Lens Catchlight -->
  <circle cx="662" cy="358" r="21" fill="#A7F3D0" opacity="0.88"/>
</svg>
